<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8eef3">
  <title>Marche Booth Map v1.7</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">EVENT GUIDE</p>
      <h1 id="eventName">Marche Booth Map</h1>
      <p id="eventMeta" class="event-meta"></p>
    </div>
    <div class="header-actions">
      <div class="favorite-summary" aria-label="お気に入り状況">
        <span>♡ 行きたい <strong id="favoriteCount">0</strong></span>
        <span>✓ 行った <strong id="visitedCount">0</strong></span>
      </div>
      <a class="soft-button" href="manual/viewer_manual.html" target="_blank" rel="noopener">閲覧マニュアル</a>
    </div>
  </header>

  <main class="app-shell">
    <section class="control-panel" aria-label="検索と絞り込み">
      <label class="search-box">
        <span>🔎</span>
        <input id="searchInput" type="search" placeholder="作家名・商品・ブース番号で検索" autocomplete="off">
      </label>
      <div id="categoryFilters" class="category-filters" aria-label="カテゴリ"></div>
      <div class="tag-filter-section"><span class="filter-label">タグ（複数選択可）</span><div id="tagFilters" class="tag-filters" aria-label="タグ"></div></div>
      <div class="favorite-mode-bar" aria-label="お気に入り表示切替">
        <button class="mode-chip active" type="button" data-view-mode="all">すべて</button>
        <button class="mode-chip" type="button" data-view-mode="favorites">♡ 行きたい</button>
        <button class="mode-chip" type="button" data-view-mode="unvisited">未訪問</button>
        <button class="mode-chip" type="button" data-view-mode="visited">✓ 行った</button>
      </div>
      <div class="result-summary">
        <span id="resultCount">0件</span>
        <button id="clearFiltersBtn" class="text-button" type="button">絞り込み解除</button>
      </div>
    </section>

    <section class="main-grid">
      <div class="map-card">
        <div class="map-toolbar">
          <div>
            <strong>会場マップ</strong>
            <span>ブースをタップすると詳細を表示します</span>
          </div>
          <div class="map-action-stack"><div class="rotation-controls" aria-label="地図の方向"><button type="button" data-rotation="0" class="active">0°</button><button type="button" data-rotation="90">90°</button><button type="button" data-rotation="180">180°</button><button type="button" data-rotation="270">270°</button></div><div class="zoom-controls" aria-label="地図操作">
            <button id="zoomOutBtn" type="button" aria-label="縮小">−</button>
            <button id="resetViewBtn" type="button" aria-label="全体表示">⌂</button>
            <button id="zoomInBtn" type="button" aria-label="拡大">＋</button>
          </div></div>
        </div>
        <div id="mapViewport" class="map-viewport" tabindex="0" aria-label="会場マップ。ドラッグで移動できます">
          <svg id="venueMap" class="venue-map" viewBox="0 0 1000 700" role="img" aria-labelledby="mapTitle mapDesc">
            <title id="mapTitle">マルシェ会場マップ</title>
            <desc id="mapDesc">入口、通路、設備、出店ブースを表示した会場図です。</desc>
            <g id="mapRotationLayer"><g id="mapContent"></g></g>
          </svg>
        </div>
        <p class="map-hint">PC: ドラッグ・ホイール / スマホ: ドラッグ・ピンチで移動・拡大縮小</p>
      </div>

      <aside class="list-card">
        <div class="list-header">
          <strong>出店者一覧</strong>
          <span id="listModeLabel">すべて</span>
        </div>
        <div id="exhibitorList" class="exhibitor-list"></div>
      </aside>
    </section>
  </main>

  <div id="detailBackdrop" class="detail-backdrop" hidden></div>
  <section id="detailSheet" class="detail-sheet" aria-live="polite" aria-label="出店者詳細" hidden>
    <button id="closeDetailBtn" class="close-button" type="button" aria-label="閉じる">×</button>
    <div id="detailContent"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
